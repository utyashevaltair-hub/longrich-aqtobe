<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00877d">
<meta name="description" content="Longrich Aqtobe — здоровье, красота, качество. Каталог и заявка в WhatsApp.">
<title>Longrich Aqtobe 04</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#1c2b27;--mut:#66767a;--brand:#00877d;--brand2:#e0f2f0;--line:#e2e8e6;--wa:#25d366;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1917;--card:#182523;--ink:#eef3f1;--mut:#9aaca6;--brand:#2fb3a5;--brand2:#1c3733;--line:#2a3b37}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px;max-width:760px;margin:auto}
.brand{background:#fff;border-radius:18px;padding:10px 16px;display:flex;justify-content:center;border:1px solid var(--line)}
.brand img{display:block;width:100%;max-width:280px;height:auto}
.tag{text-align:center;color:var(--mut);font-size:13px;margin:8px 0 0}
.search{width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 16px;max-width:760px;margin:auto}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ico{height:84px;border-radius:12px;background:var(--brand2);display:flex;align-items:center;justify-content:center;font-size:42px}
.nm{font-size:14px;font-weight:600;min-height:38px}.pr{font-weight:800;color:var(--brand)}
button{font:inherit;cursor:pointer}
.add{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:10px;font-weight:600}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--brand2);border-radius:12px;padding:4px}
.qty button{width:36px;height:34px;border:0;border-radius:10px;background:var(--card);color:var(--ink);font-size:18px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:736px;margin:auto;background:var(--brand);color:#fff;border:0;border-radius:18px;padding:15px 18px;display:flex;justify-content:space-between;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.wa{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--wa);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}
.wa.nobar{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:20px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row .t{flex:1;font-size:14px}
.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;margin:6px 0}
.big{width:100%;border:0;background:var(--brand);color:#fff;padding:14px;border-radius:14px;font-weight:700;margin-top:10px}
.big:disabled{opacity:.6}
.ghost{background:none;border:0;color:var(--mut);padding:10px;width:100%}
.note{font-size:13px;color:var(--mut)}.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;max-width:90%;text-align:center}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:20px 16px;max-width:760px;margin:auto}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.pe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0}
.pe .inp{margin:3px 0}
.pe2{display:flex;gap:6px;align-items:center}
.pe2 .c{flex:2.2}.pe2 .p{flex:1.4}.pe2 .e{flex:.7;text-align:center}
.pe2 label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:3px;white-space:nowrap}
.pe2 button{border:0;background:none;font-size:18px;padding:4px}
.ord{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.ord.done{border-left-color:#999;opacity:.75}.ord.cancelled{border-left-color:var(--bad);opacity:.6}
.ord a{color:var(--brand);font-weight:700}
.ord .bt{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ord .bt button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px}
.banner{background:#fff3cd;color:#664d03;border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 16px;max-width:728px}
@media(min-width:792px){.banner{margin:8px auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
/* Резервный каталог: показывается, если Supabase не настроен или недоступен */
var FALLBACK={"wa": "", "p": [["Капсулы облепихового масла, 120 шт", "БАДы", 32000, "🍊"], ["Кофе с кордицепсом, 10 саше", "БАДы", 11500, "☕"], ["Пребиотик из соевого зародыша, 10 стиков", "БАДы", 10500, "🌱"], ["Активные пробиотики, 20 пакетиков", "БАДы", 5000, "🥛"], ["Кордицепс милитарис, 60 капсул", "БАДы", 45000, "🍄"], ["Глюкозамин и хондроитин, 60 таблеток", "БАДы", 18000, "🦴"], ["Витамин C жевательный, 60 таблеток", "БАДы", 8000, "🍊"], ["NMN + CoQ10, 60 капсул", "БАДы", 50000, "🧬"], ["Кальций/железо/цинк жевательные, 100 шт", "БАДы", 7800, "🦷"], ["Натто и красный дрожжевой рис, 120 таблеток", "БАДы", 25000, "💊"], ["Липазный комплекс, таблетированные конфеты", "БАДы", 85000, "🍬"], ["Жидкий салат NFC (овощно-фруктовое пюре)", "БАДы", 10000, "🥗"], ["Leopower «Сокровище силы», 160 капсул", "БАДы", 85000, "💪"], ["Чай «Радостная лёгкость» (зелёный), 15 пакетиков", "Чаи", 9500, "🍵"], ["Чай «Небесный дар» (коричневый), 15 пакетиков", "Чаи", 9500, "🫖"], ["Чай «Изящная фигура» (розовый), 15 пакетиков", "Чаи", 9500, "🌸"], ["Уходовая эссенция со змеиным жиром №1, 120 мл", "Уход", 4000, "🧴"], ["Крем с лошадиным жиром, 500 г", "Уход", 10000, "🐴"], ["Крем со змеиным жиром, 500 г", "Уход", 12000, "🧴"], ["Эссенция с гиалуроновой кислотой, 220 мл", "Уход", 12000, "💧"], ["Пептидный спрей-эссенция, 80 мл", "Уход", 16000, "✨"], ["Набор с экстрактом граната (5 средств)", "Уход", 150000, "🎁"], ["Набор Yacan Platinum (3 предмета)", "Уход", 80000, "🎁"], ["Увлажняющий лосьон для тела, 165 мл", "Уход", 3500, "🧴"], ["Гель для душа со змеиным желчем, 380 мл", "Уход", 7000, "🚿"], ["Травяной гель для душа, 300 мл", "Уход", 10000, "🌿"], ["Шампунь 2-в-1, 300 мл", "Уход", 6000, "💆"], ["Роликовый дезодорант-антиперспирант, 50 мл", "Уход", 5000, "🧼"], ["Мыло с бамбуковым углём", "Уход", 5000, "🧼"], ["Антибактериальный набор «Цветочный эликсир»", "Гигиена", 30000, "🌺"], ["Средство для интимной гигиены «Двойная свежесть», 248 мл", "Гигиена", 8000, "🌸"], ["Набор гигиенических прокладок (ночные)", "Гигиена", 80000, "🩷"], ["Спрей для свежести дыхания, 15 г", "Гигиена", 4000, "🌬️"], ["Детская зубная щётка C101", "Зубы", 2200, "🪥"], ["Детская зубная паста, 60 г", "Зубы", 3000, "🍓"], ["Зубная щётка глубокого очищения", "Зубы", 1000, "🪥"], ["Зубная паста с белым чаем", "Зубы", 5000, "🦷"], ["Гостиничный набор, 5 предметов", "Зубы", 1600, "🧳"], ["Жидкое средство для стирки, 1 л", "Дом", 4500, "🧺"], ["Средство для мытья посуды, 1 л", "Дом", 7000, "🍽️"], ["Кастрюля «Хэхэ Каннэн», 28 см", "Дом", 250000, "🍲"], ["Энергетический π-стакан, 400 мл", "Дом", 46000, "🥤"]]};

var CFG=window.APP_CONFIG||{};
var sb=null;
try{if(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase)sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey)}catch(e){console.warn(e)}
var P=[],WA='',cart={},cat='Все',q='',admin=false,online=false,loaded=false,tab='p',draft=[],removed=[],waDraft='';
try{cart=JSON.parse(localStorage.getItem('lac2')||'{}')}catch(e){}
function save(){try{localStorage.setItem('lac2',JSON.stringify(cart))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n).toLocaleString('ru-RU')+' ₸'}
var WAI='<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.6.3.1.2.1.8-.1 1.4z"/></svg>';

function find(id){for(var i=0;i<P.length;i++)if(String(P[i].id)===String(id))return P[i];return null}
function shown(){return P.filter(function(p){return !p.h})}

/* ───── Загрузка данных ───── */
async function load(){
  online=false;
  if(sb){
    try{
      var a=await sb.from('products').select('*').order('sort').order('id');
      var b=await sb.from('settings').select('*');
      if(a.error)throw a.error;
      P=a.data.map(function(r){return{id:r.id,n:r.name,c:r.category,p:r.price,e:r.emoji||'🌿',h:!!r.hidden}});
      WA='';((b.data)||[]).forEach(function(s){if(s.key==='whatsapp')WA=(s.value||'').replace(/\D/g,'')});
      online=true;
    }catch(e){console.warn('Supabase:',e)}
  }
  if(!online){
    P=FALLBACK.p.map(function(p,i){return{id:i,n:p[0],c:p[1],p:p[2],e:p[3],h:false}});
    WA=FALLBACK.wa||'';
  }
  Object.keys(cart).forEach(function(k){var p=find(k);if(!p||p.h)delete cart[k]});
  save();loaded=true;
}

/* ───── Витрина ───── */
function build(){
  $('#app').innerHTML='<header><div class="brand"><img src="logo.png" alt="Longrich Aqtobe 04"></div><p class="tag">Здоровье · Красота · Качество</p><input id="q" class="search" placeholder="Поиск товара" type="search"></header><div id="ban"></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div><div class="foot">Продукция не является лекарственным средством. Перед применением рекомендуется консультация специалиста.<div id="adm"></div></div><button class="wa" id="wa" aria-label="WhatsApp">'+WAI+'</button><div id="bar"></div><div id="ov"></div>';
  $('#q').oninput=function(e){q=e.target.value.toLowerCase();grid()};
  $('#wa').onclick=function(){if(WA)window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('Здравствуйте! Хочу узнать о товарах Longrich.'),'_blank');else toast('Номер WhatsApp ещё не указан')};
  $('#chips').onclick=function(e){var c=e.target.dataset.c;if(c){cat=c;chips();grid()}};
  $('#grid').onclick=function(e){var a=e.target.dataset.a,m=e.target.dataset.m;if(a!=null)chg(a,1);if(m!=null)chg(m,-1)};
  banner();chips();grid();bar();adminBtn();
}
function banner(){$('#ban').innerHTML=(!online&&sb)?'<div class="banner">Не удалось загрузить актуальный каталог — показан сохранённый вариант.</div>':''}
function chips(){
  var cs=['Все'];shown().forEach(function(p){if(cs.indexOf(p.c)<0)cs.push(p.c)});
  if(cs.indexOf(cat)<0)cat='Все';
  $('#chips').innerHTML=cs.map(function(c){return'<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
}
function grid(){
  var h=shown().filter(function(p){return(cat==='Все'||p.c===cat)&&p.n.toLowerCase().indexOf(q)>-1}).map(function(p){
    var k=cart[p.id];
    return'<div class="card"><div class="ico">'+esc(p.e||'🌿')+'</div><div class="nm">'+esc(p.n)+'</div><div class="pr">'+money(p.p)+'</div>'+(k?'<div class="qty"><button data-m="'+p.id+'">−</button><b>'+k+'</b><button data-a="'+p.id+'">+</button></div>':'<button class="add" data-a="'+p.id+'">В корзину</button>')+'</div>'
  }).join('');
  $('#grid').innerHTML=h||'<p class="note" style="grid-column:1/-1;text-align:center">'+(loaded?'Ничего не найдено':'Загрузка…')+'</p>';
}

/* ───── Корзина ───── */
function cnt(){var n=0,s=0;Object.keys(cart).forEach(function(k){var p=find(k);if(p&&!p.h){n+=cart[k];s+=cart[k]*p.p}});return{n:n,s:s}}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();grid();bar();if($('#cartlist'))cartView()}
function bar(){
  var c=cnt();
  $('#bar').innerHTML=c.n?'<button class="bar" id="cb"><span>🛒 Корзина · '+c.n+' шт.</span><span>'+money(c.s)+'</span></button>':'';
  $('#wa').className='wa'+(c.n?'':' nobar');
  if(c.n)$('#cb').onclick=cartView;
}
function sheet(h){$('#ov').innerHTML='<div class="shade" id="sh"><div class="sheet">'+h+'</div></div>';$('#sh').onclick=function(e){if(e.target.id==='sh')close()}}
function close(){$('#ov').innerHTML=''}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
function cartView(){
  var c=cnt();if(!c.n){close();return}
  var rows=Object.keys(cart).map(function(k){var p=find(k);if(!p||p.h)return'';return'<div class="row"><div class="t">'+esc(p.e)+' '+esc(p.n)+'<br><span class="note">'+money(p.p)+' × '+cart[k]+'</span></div><div class="qty" style="width:104px"><button data-m="'+p.id+'">−</button><b>'+cart[k]+'</b><button data-a="'+p.id+'">+</button></div></div>'}).join('');
  var keepN=$('#nm')?$('#nm').value:'',keepP=$('#ph')?$('#ph').value:'',keepC=$('#cm')?$('#cm').value:'';
  sheet('<h2>Ваша заявка</h2><div id="cartlist">'+rows+'</div><div class="tot"><span>Итого</span><span>'+money(c.s)+'</span></div><input class="inp" id="nm" placeholder="Ваше имя" autocomplete="name"><input class="inp" id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="Телефон, например +7 701 123 45 67"><input class="inp" id="cm" placeholder="Комментарий (необязательно)"><button class="big" id="go">Отправить заявку</button><p class="note">Регистрация не нужна. Мы свяжемся с вами по указанному номеру, подтвердим заказ, цену и доставку.</p><button class="ghost" id="cl">Закрыть</button>');
  $('#nm').value=keepN;$('#ph').value=keepP;$('#cm').value=keepC;
  $('#cartlist').onclick=function(e){var a=e.target.dataset.a,m=e.target.dataset.m;if(a!=null)chg(a,1);if(m!=null)chg(m,-1)};
  $('#cl').onclick=close;$('#go').onclick=send;
}
async function send(){
  var n=$('#nm').value.trim(),ph=$('#ph').value.trim(),cm=$('#cm').value.trim();
  if(ph.replace(/\D/g,'').length<10){toast('Укажите номер телефона');return}
  if(!sb&&!WA){toast('Заявки пока не принимаются. Попробуйте позже.');return}
  var c=cnt(),items=[];
  Object.keys(cart).forEach(function(k){var p=find(k);if(p&&!p.h)items.push({id:p.id,n:p.n,p:p.p,q:cart[k]})});
  var lines=items.map(function(i,j){return(j+1)+'. '+i.n+' × '+i.q+' = '+money(i.p*i.q)}).join('\n');
  var txt='Заявка с сайта Longrich Aqtobe\nИмя: '+(n||'—')+'\nТелефон: '+ph+(cm?'\nКомментарий: '+cm:'')+'\n\n'+lines+'\n\nИтого: '+money(c.s);
  $('#go').disabled=true;
  var req=online&&sb?sb.from('orders').insert({name:n.slice(0,100)||null,phone:ph.slice(0,25),comment:cm.slice(0,500)||null,items:items,total:c.s}):null;
  if(WA)window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(txt),'_blank');
  var saved=false;
  if(req){try{var r=await req;saved=!r.error;if(r.error)console.warn(r.error)}catch(e){console.warn(e)}}
  if(!saved&&!WA){$('#go').disabled=false;toast('Не удалось отправить заявку. Проверьте интернет и попробуйте ещё раз.');return}
  cart={};save();grid();bar();
  sheet('<h2>Спасибо! 🌿</h2><p>'+(WA?'Заявка готова к отправке в WhatsApp. Нажмите «Отправить» в открывшемся чате, и мы свяжемся с вами.':'Заявка принята. Мы свяжемся с вами по указанному номеру.')+'</p><button class="big" id="ok">Хорошо</button>');
  $('#ok').onclick=close;
}

/* ───── Вход и админ-панель ───── */
async function checkAdmin(){
  admin=false;
  if(sb){try{var s=await sb.auth.getSession();if(s.data&&s.data.session){var r=await sb.rpc('is_admin');admin=r.data===true}}catch(e){console.warn(e)}}
  adminBtn();
}
function adminBtn(){var a=$('#adm');if(!a)return;a.innerHTML=admin?'<button class="ghost" id="ab">⚙️ Админ-панель</button>':'';if(admin)$('#ab').onclick=adminOpen}
function loginSheet(){
  if(!sb){toast('Supabase не подключён (см. config.js)');return}
  sheet('<h2>Вход для администратора</h2><input class="inp" id="le" type="email" autocomplete="username" placeholder="Email"><input class="inp" id="lp" type="password" autocomplete="current-password" placeholder="Пароль"><button class="big" id="lg">Войти</button><button class="ghost" id="lc">Закрыть</button>');
  $('#lc').onclick=close;
  $('#lg').onclick=async function(){
    var em=$('#le').value.trim(),pw=$('#lp').value;
    if(!em||!pw){toast('Введите email и пароль');return}
    var r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){toast('Неверный email или пароль');return}
    await checkAdmin();
    if(!admin){toast('У этого пользователя нет прав администратора');await sb.auth.signOut();return}
    await load();banner();chips();grid();bar();adminOpen();
  };
}
function adminOpen(){
  draft=P.map(function(p){return{id:p.id,n:p.n,c:p.c,p:p.p,e:p.e,h:p.h}});
  removed=[];waDraft=WA;tab='p';adminDraw();
}
function adminDraw(){
  sheet('<h2>Админ-панель</h2><div class="tabs"><button class="chip'+(tab==='p'?' on':'')+'" data-t="p">Товары</button><button class="chip'+(tab==='o'?' on':'')+'" data-t="o">Заказы</button><button class="chip'+(tab==='s'?' on':'')+'" data-t="s">Настройки</button></div><div id="atab"></div><button class="ghost" id="ac">Закрыть</button>');
  $('#ac').onclick=close;
  document.querySelector('.tabs').onclick=function(e){var t=e.target.dataset.t;if(t){tab=t;adminDraw()}};
  if(tab==='p')prodTab();else if(tab==='o')ordersTab();else setTab();
}
function prodTab(){
  var cats=[];draft.forEach(function(p){if(p.c&&cats.indexOf(p.c)<0)cats.push(p.c)});
  $('#atab').innerHTML='<datalist id="cats">'+cats.map(function(c){return'<option value="'+esc(c)+'">'}).join('')+'</datalist><div class="note">Название · категория · цена (₸) · значок · скрыть</div><div id="pl"></div><button class="ghost" id="an">+ Добавить товар</button><button class="big" id="as">Сохранить</button>';
  plist();
  $('#an').onclick=function(){draft.push({id:null,n:'Новый товар',c:cat!=='Все'?cat:(cats[0]||'БАДы'),p:0,e:'🌿',h:false});plist();var l=$('#pl');l.lastChild&&l.lastChild.scrollIntoView({block:'center'})};
  $('#as').onclick=saveAll;
}
function plist(){
  $('#pl').innerHTML=draft.map(function(p,i){
    return'<div class="pe"><input class="inp" data-i="'+i+'" data-f="n" value="'+esc(p.n)+'" maxlength="200"><div class="pe2"><input class="inp c" list="cats" data-i="'+i+'" data-f="c" value="'+esc(p.c)+'" maxlength="60"><input class="inp p" type="number" min="0" inputmode="numeric" data-i="'+i+'" data-f="p" value="'+p.p+'"><input class="inp e" data-i="'+i+'" data-f="e" value="'+esc(p.e)+'" maxlength="8"><label><input type="checkbox" data-i="'+i+'" data-f="h"'+(p.h?' checked':'')+'>скрыть</label><button data-d="'+i+'" aria-label="Удалить">🗑</button></div></div>'
  }).join('');
  var el=$('#pl');
  el.oninput=el.onchange=function(e){var d=e.target.dataset;if(d.i==null)return;draft[d.i][d.f]=e.target.type==='checkbox'?e.target.checked:e.target.value};
  el.onclick=function(e){var d=e.target.dataset.d;if(d==null)return;var p=draft[d];if(!confirm('Удалить «'+p.n+'»? Чтобы просто убрать с витрины, отметьте «скрыть».'))return;if(p.id!=null)removed.push(p.id);draft.splice(d,1);plist()};
}
function setTab(){
  $('#atab').innerHTML='<label class="note">Номер WhatsApp (только цифры, с кодом страны, например 77011234567)</label><input class="inp" id="wn" inputmode="numeric" value="'+esc(waDraft)+'"><button class="big" id="as">Сохранить</button><button class="ghost" id="lo">Выйти из админки</button>';
  $('#wn').oninput=function(e){waDraft=e.target.value.replace(/\D/g,'')};
  $('#as').onclick=saveAll;
  $('#lo').onclick=async function(){await sb.auth.signOut();admin=false;await load();banner();chips();grid();bar();adminBtn();close()};
}
async function saveAll(){
  var b=$('#as');b.disabled=true;b.textContent='Сохранение…';
  try{
    var ex=[],nw=[];
    draft.forEach(function(p,i){
      var row={name:String(p.n).trim()||'Без названия',category:String(p.c||'').trim()||'Другое',price:Math.max(0,Math.round(Number(p.p)||0)),emoji:String(p.e||'').trim()||'🌿',hidden:!!p.h,sort:i*10};
      if(p.id!=null){row.id=p.id;ex.push(row)}else nw.push(row);
    });
    var r;
    if(removed.length){r=await sb.from('products').delete().in('id',removed);if(r.error)throw r.error}
    if(ex.length){r=await sb.from('products').upsert(ex);if(r.error)throw r.error}
    if(nw.length){r=await sb.from('products').insert(nw);if(r.error)throw r.error}
    r=await sb.from('settings').upsert({key:'whatsapp',value:waDraft});if(r.error)throw r.error;
    await load();banner();chips();grid();bar();
    toast('Сохранено ✅');adminOpen();
  }catch(e){toast('Ошибка: '+(e.message||e));b.disabled=false;b.textContent='Сохранить'}
}
async function ordersTab(){
  $('#atab').innerHTML='<p class="note">Загрузка…</p>';
  var r=await sb.from('orders').select('*').order('id',{ascending:false}).limit(50);
  if(r.error){$('#atab').innerHTML='<p class="note">Не удалось загрузить заказы: '+esc(r.error.message)+'</p>';return}
  var L={new:'Новая',done:'Обработана',cancelled:'Отменена'};
  $('#atab').innerHTML=r.data.length?r.data.map(function(o){
    var d=new Date(o.created_at).toLocaleString('ru-RU',{timeZone:'Asia/Aqtobe',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    var it=(o.items||[]).map(function(i){return esc(i.n)+' × '+esc(i.q)}).join('<br>');
    var bt=['new','done','cancelled'].filter(function(s){return s!==o.status}).map(function(s){return'<button data-o="'+o.id+'" data-s="'+s+'">'+L[s]+'</button>'}).join('');
    return'<div class="ord '+esc(o.status)+'"><b>№'+o.id+'</b> · '+d+' · '+L[o.status]+'<br>'+esc(o.name||'—')+' · <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a>'+(o.comment?'<br><span class="note">'+esc(o.comment)+'</span>':'')+'<div style="margin:6px 0">'+it+'</div><b>'+money(o.total)+'</b><div class="bt">'+bt+'</div></div>'
  }).join(''):'<p class="note">Заявок пока нет.</p>';
  $('#atab').onclick=async function(e){
    var id=e.target.dataset.o,s=e.target.dataset.s;if(id==null)return;
    var u=await sb.from('orders').update({status:s}).eq('id',id);
    if(u.error){toast('Ошибка: '+u.error.message);return}
    ordersTab();
  };
}

/* ───── Запуск ───── */
(async function(){
  build();
  await load();banner();chips();grid();bar();
  await checkAdmin();
  if(location.hash==='#admin'){admin?adminOpen():loginSheet()}
  window.addEventListener('hashchange',function(){if(location.hash==='#admin'){admin?adminOpen():loginSheet()}});
})();
})();
</script>
</body>
